name: Supabase Keep-Alive

on:
  schedule:
    # Run every Thursday at 00:00 UTC
    - cron: '0 0 * * 4'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_KEY secret is missing."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Sending keep-alive request to Supabase REST API..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$CLEAN_URL/rest/v1/")

          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Successfully pinged Supabase REST API."
          else
            echo "Keep-alive ping failed with status code $HTTP_STATUS."
            exit 1
          fi
